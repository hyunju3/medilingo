<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#58cc02">
<title>메디링고 — 의학용어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --green:#58cc02; --green-d:#58a700; --green-l:#d7ffb8;
  --red:#ff4b4b; --red-d:#ea2b2b; --red-l:#ffdfe0;
  --blue:#1cb0f6; --blue-d:#1899d6; --blue-l:#ddf4ff;
  --purple:#ce82ff; --purple-d:#a568cc;
  --gold:#ffc800; --gold-d:#e5a400;
  --ink:#3c3c3c; --mute:#777; --line:#e5e5e5; --bg:#fff; --soft:#f7f7f7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Noto Sans KR",sans-serif}
body{min-height:100vh}
button{font-family:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}
.ko{font-family:"Noto Sans KR",sans-serif}

/* top bar */
.topbar{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--line);z-index:5}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-weight:900;font-size:20px;color:var(--green);letter-spacing:-.3px}
.stats{display:flex;gap:12px;font-weight:800;font-size:16px;align-items:center}
.stat{display:flex;align-items:center;gap:4px}
.stat.fire{color:#ff9600}.stat.xp{color:var(--gold-d)}
.iconbtn{background:none;border:2px solid var(--line);border-radius:12px;font-size:17px;padding:4px 8px;cursor:pointer;line-height:1.2}

/* continue card */
.chtabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.chtabs::-webkit-scrollbar{display:none}
.chtab{flex:none;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;padding:7px 12px;font-weight:800;font-size:14px;cursor:pointer;font-family:"Noto Sans KR",sans-serif;color:var(--ink);text-align:left;line-height:1.25}
.chtab small{display:block;font-size:11px;color:var(--mute);font-weight:700}
.chtab.on{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.today{margin:12px 0 4px;border:2px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.today .tl{font-size:13px;font-weight:800;color:var(--mute);font-family:"Noto Sans KR",sans-serif}
.today .tn{font-size:19px;font-weight:900;font-family:"Noto Sans KR",sans-serif}
.today .ts{font-size:14px;color:var(--mute);font-family:"Noto Sans KR",sans-serif}
.pbar{height:12px;background:var(--line);border-radius:8px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green);border-radius:8px}
.prow{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--mute);font-family:"Noto Sans KR",sans-serif}

/* unit header */
.unit{margin:26px 0 4px;background:var(--green);color:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 4px 0 var(--green-d)}
.unit.u1{background:#1cb0f6;box-shadow:0 4px 0 #1899d6}
.unit.u2{background:#ce82ff;box-shadow:0 4px 0 #a568cc}
.unit.u3{background:#ff9600;box-shadow:0 4px 0 #e08600}
.unit.u4{background:#ff4b4b;box-shadow:0 4px 0 #ea2b2b}
.unit.u5{background:#2b70c9;box-shadow:0 4px 0 #1f5aa6}
.unit.u6{background:#00c2a8;box-shadow:0 4px 0 #00a38d}
.unit small{display:block;opacity:.9;font-weight:800;font-size:12px}
.unit b{font-size:18px;font-weight:900;font-family:"Noto Sans KR",sans-serif}

/* path */
.path{display:flex;flex-direction:column;align-items:center;padding:24px 0 8px;gap:20px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px}
.node button.circle{width:74px;height:68px;border-radius:50%;border:none;background:var(--green);box-shadow:0 7px 0 var(--green-d);
  color:#fff;font-size:28px;cursor:pointer;transition:transform .08s}
.node button.circle:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d)}
.node.done button.circle{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.locked button.circle{background:#e5e5e5;box-shadow:0 7px 0 #c7c7c7;color:#afafaf}
.node.extra button.circle{background:var(--purple);box-shadow:0 7px 0 var(--purple-d)}
.node .lbl{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:14px;text-align:center;max-width:200px;line-height:1.3}
.node.locked .lbl{color:#afafaf}
.node .lbl span{display:block;color:var(--mute);font-weight:500;font-size:12px}
.node.current::before{content:"여기부터!";position:absolute;top:-34px;background:#fff;border:2px solid var(--line);color:var(--green);
  font-weight:900;padding:4px 12px;border-radius:10px;font-size:14px;white-space:nowrap;font-family:"Noto Sans KR",sans-serif;animation:bob 1.2s ease-in-out infinite;z-index:2}
.node.current button.circle{outline:5px solid var(--green-l);outline-offset:4px}
@keyframes bob{50%{transform:translateY(-4px)}}

.footer-note{color:var(--mute);font-size:12px;text-align:center;padding:16px 0 40px;font-family:"Noto Sans KR",sans-serif;line-height:1.7}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:800;cursor:pointer;font-size:13px;font-family:"Noto Sans KR",sans-serif}

/* lesson */
#lesson{min-height:100vh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;height:64px}
.xbtn{background:none;border:none;font-size:26px;color:#afafaf;cursor:pointer;padding:0 4px}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:10px;transition:width .35s;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:4px}
.misscount{color:var(--red);font-weight:900;font-size:15px;white-space:nowrap;font-family:"Noto Sans KR",sans-serif}
.lbody{flex:1;padding:14px 0 190px}
.qtype{font-weight:900;font-size:21px;margin:4px 0 16px;font-family:"Noto Sans KR",sans-serif;line-height:1.35}
.qtag{display:inline-block;font-size:12px;font-weight:800;color:var(--purple-d);background:#f6ecff;border-radius:8px;padding:3px 8px;margin-bottom:8px;font-family:"Noto Sans KR",sans-serif}
.prompt{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.bubble{border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:21px;font-weight:800;line-height:1.35}
.bubble{white-space:pre-line}
.bubble.kot{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:19px}
.bubble.desc{font-family:"Noto Sans KR",sans-serif;font-weight:500;font-size:16px;line-height:1.6}
.speak{width:52px;height:52px;border-radius:14px;border:none;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff;font-size:22px;cursor:pointer;flex:none}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.opts{display:grid;gap:11px}
.opt{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;padding:13px 14px;text-align:left;
  font-size:16px;font-weight:700;cursor:pointer;color:var(--ink);display:flex;gap:12px;align-items:center;font-family:"Nunito","Noto Sans KR",sans-serif;line-height:1.35}
.opt .k{width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:13px;color:#afafaf;flex:none}
.opt.sel{border-color:#84d8ff;background:var(--blue-l);color:var(--blue-d)}
.opt.sel .k{border-color:#84d8ff;color:var(--blue-d)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt:disabled{cursor:default}
.answer-line{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:24px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;background:#fff;padding:10px 14px;font-size:18px;font-weight:800;cursor:pointer;color:var(--ink);font-family:"Nunito",sans-serif}
.tile.used{background:var(--line);color:transparent;border-color:var(--line);cursor:default}
.tile.slash{padding:10px 4px;border:none;background:none;color:#bbb;cursor:default}
.typein{width:100%;font-size:20px;font-weight:800;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--soft);font-family:"Nunito",sans-serif;color:var(--ink);outline:none}
.typein:focus{border-color:#84d8ff;background:#fff}
.pre-hint{color:var(--mute);font-size:13px;margin-top:8px;font-family:"Noto Sans KR",sans-serif}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mbtn{border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;padding:12px 8px;font-size:15px;font-weight:800;cursor:pointer;min-height:56px;color:var(--ink);font-family:"Nunito","Noto Sans KR",sans-serif;line-height:1.3}
.mbtn.sel{border-color:#84d8ff;background:var(--blue-l);color:var(--blue-d)}
.mbtn.ok{color:#ccc;background:#fff;cursor:default;border-bottom-width:2px}
.mbtn.bad{border-color:var(--red);background:var(--red-l);color:var(--red-d);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* study card */
.card{border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.card .new{align-self:flex-start;background:var(--purple);color:#fff;font-weight:900;font-size:12px;border-radius:8px;padding:3px 9px;font-family:"Noto Sans KR",sans-serif}
.card .en{font-size:27px;font-weight:900;line-height:1.2;word-break:break-word}
.card .pr{font-size:16px;color:var(--blue-d);font-weight:700;font-family:"Noto Sans KR",sans-serif}
.card .mean{font-size:21px;font-weight:900;font-family:"Noto Sans KR",sans-serif;color:var(--green-d)}
.card .row{font-size:14px;font-family:"Noto Sans KR",sans-serif;line-height:1.6;background:var(--soft);border-radius:12px;padding:10px 12px}
.card .row b{color:var(--mute);font-size:12px;display:block}
.rr{padding:4px 0;border-top:1px dashed #ddd}.rr:first-of-type{border-top:none}.rf{font-weight:900;color:var(--purple-d);font-family:"Nunito",sans-serif}
.ra{margin-top:4px;line-height:1.9}
.chip{display:inline-block;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:1px 8px;margin:0 5px 4px 0;font-size:13px;cursor:pointer;font-family:"Nunito","Noto Sans KR",sans-serif;font-weight:700}
.chip i{font-style:normal;color:var(--mute);font-weight:500;font-family:"Noto Sans KR",sans-serif}
.abrow{font-family:"Noto Sans KR",sans-serif;font-size:15px;color:var(--mute);font-weight:700}.abrow b{background:#fff4d6;color:#9a6b00;border-radius:8px;padding:2px 10px;font-family:"Nunito",sans-serif;font-size:17px;margin-left:4px}
.card .pg{font-size:12px;color:var(--mute);font-family:"Noto Sans KR",sans-serif}
.cardnav{display:flex;gap:10px;margin-top:16px}
.cardnav .big{flex:1}
.dots{display:flex;gap:5px;justify-content:center;margin:14px 0 0;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;border-top:2px solid var(--line);background:#fff;padding:16px 0 20px;z-index:10}
.sheet .wrap{display:flex;flex-direction:column;gap:10px}
.sheet.ok{background:var(--green-l);border-top-color:var(--green-l)}
.sheet.bad{background:var(--red-l);border-top-color:var(--red-l)}
.sheet.hint{background:#fff4d6;border-top-color:#fff4d6}
.fb-title{font-weight:900;font-size:21px;display:flex;align-items:center;gap:10px;font-family:"Noto Sans KR",sans-serif}
.sheet.ok .fb-title{color:var(--green-d)} .sheet.bad .fb-title{color:var(--red-d)} .sheet.hint .fb-title{color:#c08500}
.fb-text{font-size:15px;font-family:"Noto Sans KR",sans-serif;line-height:1.55;max-height:30vh;overflow:auto}
.sheet.ok .fb-text{color:var(--green-d)} .sheet.bad .fb-text{color:var(--red-d)} .sheet.hint .fb-text{color:#9a6b00}
.big{width:100%;border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:900;letter-spacing:.4px;color:#fff;cursor:pointer;
  background:var(--green);box-shadow:0 4px 0 var(--green-d);font-family:"Noto Sans KR",sans-serif}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.big:disabled{background:var(--line);color:#afafaf;box-shadow:0 4px 0 #d0d0d0;cursor:default;transform:none}
.big.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.big.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d)}
.big.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.big.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* result */
.result{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px 0}
.result h2{font-size:28px;font-weight:900;margin:0;color:var(--gold-d);font-family:"Noto Sans KR",sans-serif}
.cards{display:flex;gap:10px;margin:6px 0;flex-wrap:wrap;justify-content:center}
.rc{border:2px solid var(--gold);border-radius:14px;overflow:hidden;min-width:100px}
.rc b{display:block;background:var(--gold);color:#fff;font-size:12px;padding:4px 0;font-family:"Noto Sans KR",sans-serif}
.rc span{display:block;padding:10px 0;font-size:21px;font-weight:900;color:var(--gold-d)}
.rc.g{border-color:var(--green)} .rc.g b{background:var(--green)} .rc.g span{color:var(--green-d)}
.rc.b{border-color:var(--blue)} .rc.b b{background:var(--blue)} .rc.b span{color:var(--blue-d)}
.weaklist{width:100%;text-align:left;border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-family:"Noto Sans KR",sans-serif;font-size:14px}
.weaklist h4{margin:6px 0;font-size:14px;color:var(--red-d)}
.weaklist div{padding:3px 0;border-bottom:1px dashed var(--line)}
.weaklist div:last-child{border:none}
.result .big{max-width:340px}

/* notes page */
#notes .wrap{padding-bottom:40px}
.nhead{display:flex;align-items:center;gap:10px;height:60px}
.nhead h3{margin:0;font-family:"Noto Sans KR",sans-serif;font-size:19px}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:4px;font-family:"Noto Sans KR",sans-serif}
.tag.m{background:#ffe6e6;color:var(--red-d)}.tag.s{background:#e7f1fb;color:var(--blue-d)}.tag.p{background:#f6ecff;color:var(--purple-d)}.tag.c{background:#fff4d6;color:#9a6b00}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:18px}
.modal .box{background:#fff;border-radius:20px;padding:22px;max-width:420px;width:100%;text-align:center;font-family:"Noto Sans KR",sans-serif}
.modal .box h3{margin:0 0 8px;font-size:20px}
.modal .box p{color:var(--mute);margin:0 0 16px;font-size:14px;line-height:1.6}
.modal .box .big{margin-top:10px}
.toast{position:fixed;left:50%;bottom:170px;transform:translate(-50%,20px);background:#3c3c3c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-family:"Noto Sans KR",sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <div class="topbar"><div class="wrap">
    <div class="brand">메디링고</div>
    <div class="stats">
      <div class="stat fire" title="연속 학습일">🔥 <span id="streak">0</span></div>
      <div class="stat xp" title="경험치">⚡ <span id="xp">0</span></div>
      <button class="iconbtn" id="notesBtn" aria-label="오답 노트">📒</button>
      <button class="iconbtn snd" aria-label="소리 켜기/끄기">🔊</button>
    </div>
  </div></div>
  <div class="wrap">
    <div class="chtabs" id="chtabs"></div>
    <div class="today" id="today"></div>
    <div id="units"></div>
    <div class="footer-note">
      교재 『문제 중심 의학용어』에 나온 용어만 출제해요. 한글 발음과 단어 분석은 교재 밖 보충 설명이에요.<br>
      강마다 <b>새 단어 카드</b>를 먼저 보고 → <b>연습 문제</b>를 풀어요.<br>
      틀리면 힌트 → 다시 풀기 → 그래도 틀리면 정답과 설명. 틀린 문제는 레슨 끝에 다시 나와요.<br>
      <div id="chnotes"></div>
      <button class="linkbtn" id="resetBtn">기록 초기화</button>
    </div>
  </div>
</section>

<!-- STUDY CARDS -->
<section id="study" class="hidden">
  <div class="wrap">
    <div class="lhead">
      <button class="xbtn" data-quit aria-label="나가기">✕</button>
      <div class="bar"><i id="sprog" style="width:0%"></i></div>
      <button class="iconbtn snd" aria-label="소리 켜기/끄기">🔊</button>
    </div>
    <div id="cardArea"></div>
    <div class="dots" id="dots"></div>
    <div class="cardnav">
      <button class="big ghost" id="prevCard">이전</button>
      <button class="big blue" id="nextCard">다음</button>
    </div>
    <div style="height:30px"></div>
  </div>
</section>

<!-- LESSON -->
<section id="lesson" class="hidden">
  <div class="wrap" style="width:100%">
    <div class="lhead">
      <button class="xbtn" data-quit aria-label="나가기">✕</button>
      <div class="bar"><i id="prog" style="width:0%"></i></div>
      <button class="iconbtn snd" aria-label="소리 켜기/끄기">🔊</button>
      <div class="misscount">오답 <span id="miss">0</span></div>
    </div>
    <div class="lbody" id="qarea"></div>
  </div>
  <div class="sheet" id="sheet"><div class="wrap">
    <div id="fb" class="hidden"><div class="fb-title" id="fbTitle"></div><div class="fb-text" id="fbText"></div></div>
    <button class="big" id="mainBtn" disabled>확인</button>
  </div></div>
</section>

<!-- RESULT -->
<section id="result" class="hidden"><div class="wrap result" id="resultInner"></div></section>

<!-- NOTES -->
<section id="notes" class="hidden"><div class="wrap">
  <div class="nhead"><button class="xbtn" id="notesBack" aria-label="뒤로">←</button><h3>오답 노트</h3></div>
  <div id="notesInner"></div>
</div></section>

<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="box" id="modalBox"></div></div>

function tone(f,st,du,ty="sine",vo=.18){const c=ac();if(!c)return;const t=c.currentTime+st;const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vo,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(g).connect(c.destination);o.start(t);o.stop(t+du+.05)}
const SFX={tap(){tone(660,0,.06,"sine",.06)},ok(){tone(784,0,.12,"triangle",.2);tone(1175,.09,.22,"triangle",.2)},bad(){tone(196,0,.18,"sawtooth",.09);tone(147,.12,.28,"sawtooth",.09)},pair(){tone(880,0,.08,"triangle",.12)},flip(){tone(520,0,.07,"sine",.08);tone(700,.05,.08,"sine",.08)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.12,.25,"triangle",.18));tone(1319,.5,.5,"triangle",.16)}};

/* ===================== QUESTION BUILDERS ===================== */
function poolFor(it){
  const same=ITEMS.filter(x=>x.id!==it.id&&x.c===it.c);
  const lesson=same.filter(x=>x.l===it.l);
  return lesson.length>=3?lesson.concat(same):same.concat(ITEMS.filter(x=>x.id!==it.id));
}
function distract(it,f,n=3){
  const seen=new Set([it[f]]),out=[];
  for(const x of shuffle(poolFor(it).filter(x=>x.l===it.l)).concat(shuffle(poolFor(it)))){const v=f==="en"?x.en:x[f];if(v&&!seen.has(v)){seen.add(v);out.push(v)}if(out.length>=n)break}
  return out;
}
function mc(it,title,prompt,field,ansVal,hint,kind,extra={}){
  const opts=shuffle([ansVal,...distract(it,field)]);
  return Object.assign({t:"mc",id:it.id,kind,title,opts,a:opts.indexOf(ansVal),hint,expl:explain(it)},prompt,extra);
}
function explain(it){return `<b>${esc(it.en)}</b>${it.ab?" ("+esc(it.ab)+")":""} [${esc(it.pr)}] = ${esc(it.ko)}`+(it.ana?`<br>${esc(it.ana)}`:"")}
function firstHint(it){const s=mainEn(it).replace(/^-/,"");return `‘${s.slice(0,2)}…’(으)로 시작해요`}
const Q={
  meaning:it=>mc(it,it.c==="abbr"?"이 약어의 뜻은?":"뜻을 고르세요",{prompt:it.en+(it.ab?"  ("+it.ab+")":""),speak:true},"ko",it.ko,
    it.ana?("구조를 나눠 보세요: "+it.ana.replace(/\(.*?\)/g,"")):(it.desc?"설명: "+it.desc.slice(0,30)+"…":"한국어 뜻의 첫 글자: "+it.ko[0]),"뜻"),
  term:it=>{const q=mc(it,"알맞은 의학용어를 고르세요",{promptKo:it.ko},"en",it.en,firstHint(it),"뜻");
    q.opts=q.opts.map(o=>{const x=ITEMS.find(y=>y.en===o&&y.ab);return x?o+"  ("+x.ab+")":o});return q},
  pron:it=>mc(it,"올바른 한글 발음을 고르세요",{prompt:it.en,speak:true},"pr",it.pr,"🔊 버튼으로 들어 보세요. 첫소리는 ‘"+it.pr[0]+"’예요","발음"),
  desc:it=>mc(it,"설명에 맞는 용어를 고르세요",{promptDesc:it.desc},"en",it.en,"뜻: "+it.ko.replace(/./g,(c,i)=>i===0?c:"○"),"뜻",{tag:"증상·설명으로 찾기"}),
  alt:it=>{const names=it.ko.split(/[,·]/).map(s=>s.replace(/\(.*?\)/g,"").trim()).filter(Boolean);const a=names[0],b=names[1];
    const others=ITEMS.filter(x=>x.id!==it.id&&x.c===it.c).map(x=>x.ko.split(/[,·]/)[0].replace(/\(.*?\)/g,"").trim()).filter(v=>v&&v!==b&&v!==a);
    const opts=shuffle([b,...pick([...new Set(others)],3)]);
    return {t:"mc",id:it.id,kind:"혼동",title:`‘${a}’의 다른 이름은?`,promptKo:it.en,opts,a:opts.indexOf(b),hint:"같은 용어를 부르는 다른 한국어 이름이에요",expl:explain(it),tag:"한국어 다른 이름"}},
  type:it=>{let acc=(it.acc||it.en.split(",").map(s=>s.replace(/\(.*?\)/g,"").trim())).filter(Boolean);
    if(it.c==="abbr")acc=it.en.split(",").map(s=>s.trim());
    return {t:"type",id:it.id,kind:"철자",title:it.c==="abbr"?"약어를 직접 쓰세요":"영어 철자를 직접 쓰세요",promptKo:it.ko,accept:acc,show:acc[0],
      hint:`첫 글자: ${acc[0].replace(/^-/,"").slice(0,2)}… (${acc[0].replace(/[^a-z]/gi,"").length}글자)`,expl:explain(it)}},
  abko:it=>{const others=[...new Set(ITEMS.filter(x=>x.ab&&x.id!==it.id&&x.ko!==it.ko).map(x=>x.ko))];const opts=shuffle([it.ko,...pick(others.filter(o=>ITEMS.some(x=>x.ab&&x.ko===o&&x.ch===it.ch)),3)]);
    return {t:"mc",id:it.id,kind:"약어",title:"이 약어의 뜻은?",prompt:it.ab,speak:false,opts,a:opts.indexOf(it.ko),hint:"풀어 쓰면: "+mainEn(it).split(" ").map(w=>w[0]+"…").join(" "),expl:explain(it),tag:"약어"}},
  koab:it=>{const others=[...new Set(ITEMS.filter(x=>x.ab&&x.ab!==it.ab&&x.ch===it.ch).map(x=>x.ab))];const opts=shuffle([it.ab,...pick(others,3)]);
    return {t:"mc",id:it.id,kind:"약어",title:"알맞은 약어를 고르세요",promptKo:it.ko+"\n"+mainEn(it),opts,a:opts.indexOf(it.ab),hint:"영어 단어의 첫 글자를 모아 보세요: "+mainEn(it),expl:explain(it),tag:"약어"}},
  abtype:it=>{const acc=it.ab.split(",").map(s=>s.trim());return {t:"type",id:it.id,kind:"약어",title:"약어를 직접 쓰세요",promptKo:it.ko+" — "+mainEn(it),accept:acc,show:acc[0],hint:`${acc[0].length}글자, 첫 글자 ${acc[0][0]}`,expl:explain(it),tag:"약어"}},
  build:it=>{const pool=[...new Set(ITEMS.flatMap(x=>x.parts||[]))].filter(x=>!it.parts.includes(x));
    return {t:"build",id:it.id,kind:"구조",title:"조각을 맞춰 용어를 만드세요",promptKo:it.ko,tiles:shuffle([...it.parts,...pick(pool,3)]),ans:it.parts,
      hint:`첫 조각은 ‘${it.parts[0]}’, 모두 ${it.parts.length}조각이에요 (결합모음 o 포함)`,expl:explain(it)}},
};
function typesFor(it){
  const t=["meaning","term"];
  const len=mainEn(it).length;
  if(it.c==="abbr"){t.push("type");return t}

  if(len<=22)t.push("type");

  if(it.desc)t.push("desc","desc");
  if(it.c!=="abbr"&&/[,·]/.test(it.ko.replace(/\(.*?\)/g,""))&&it.c!=="form")t.push("alt");
  return t;
}
function qMatch(items){const its=pick(items,Math.min(5,items.length));return {t:"match",title:"짝을 맞추세요",pairs:its.map(i=>({id:i.id,en:i.en,ko:i.ko}))}}
function qConfuse(c){const o=c.opts[c.a],opts=shuffle(c.opts);return {t:"mc",kind:"혼동",title:c.q,opts,a:opts.indexOf(o),hint:"글자 하나, 접두사 하나 차이에 주목하세요",expl:c.why,tag:"헷갈리는 짝"}}

function buildQuiz(l,mode){
  let qs=[];
  if(mode.confuse)return shuffle(CONFUSE.filter(c=>(c.ch||2)===CH.no)).map(qConfuse);
  let items=mode.review?Object.keys(S.weak).map(id=>BY[id]).filter(Boolean):mode.all?pick(ITEMS.filter(i=>i.ch===CH.no&&!/P0$/.test(i.l)),20):LBY[l.key];
  const per=mode.all?1:2;
  for(const it of items){for(const ty of pick(typesFor(it),per))qs.push(Q[ty](it))}
  qs=shuffle(qs);
  const cap=mode.all?20:mode.review?20:Math.max(12,Math.min(24,items.length*2));
  qs=qs.slice(0,cap);
  if(items.length>=4){qs.splice(Math.min(4,qs.length),0,qMatch(items));if(items.length>=10&&qs.length>12)qs.splice(Math.floor(qs.length*.7),0,qMatch(items))}
  return qs;
}

/* ===================== QUIZ ENGINE ===================== */
let L=null;
function startQuiz(l,mode){
  L={lesson:l,mode,qs:buildQuiz(l,mode),i:0,done:0,first:0,miss:0,mistakes:new Map()};
  L.total=L.qs.length;show("lesson");renderQ();
}
function setProg(){$("#prog").style.width=Math.min(100,L.done/L.total*100)+"%";$("#miss").textContent=L.miss}
function resetSheet(){$("#sheet").className="sheet";$("#fb").classList.add("hidden")}
function feedback(k,t,x){$("#sheet").className="sheet "+k;$("#fb").classList.remove("hidden");$("#fbTitle").innerHTML=t;$("#fbText").innerHTML=x||""}
function markWeak(id,kind){if(!id||!BY[id])return;let w=S.weak[id];if(!w||typeof w!=="object")w={n:0,k:{}};w.n++;w.k[kind]=(w.k[kind]||0)+1;S.weak[id]=w;save()}

function renderQ(){
  const q=L.qs[L.i];L.tries=0;L.state="answer";L.sel=null;setProg();resetSheet();
  const A=$("#qarea");const it=BY[q.id];
  let h=(q.tag?`<div class="qtag">${esc(q.tag)}</div>`:"")+`<div class="qtype">${esc(q.title)}</div>`;
  if(q.t!=="match"){
    if(q.prompt)h+=`<div class="prompt">${q.speak?`<button class="speak" id="spk" aria-label="듣기">🔊</button>`:""}<div class="bubble">${esc(q.prompt)}</div></div>`;
    else if(q.promptDesc)h+=`<div class="prompt"><div class="bubble desc">${esc(q.promptDesc)}</div></div>`;
    else if(q.promptKo)h+=`<div class="prompt"><div class="bubble ${isLatin(q.promptKo)?"":"kot"}">${esc(q.promptKo)}</div></div>`;
  }
  if(q.t==="mc")h+=`<div class="opts">`+q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join("")+`</div>`;
  else if(q.t==="build")h+=`<div class="answer-line" id="aline"></div><div class="bank" id="bank">`+q.tiles.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t)}</button>`).join("")+`</div>`;
  else if(q.t==="type")h+=`<input class="typein" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력"><div class="pre-hint">대소문자, / , - , 띄어쓰기는 상관없어요</div>`;
  else if(q.t==="match"){const a=shuffle(q.pairs),b=shuffle(q.pairs);
    h+=`<div class="match"><div class="col">`+a.map(p=>`<button class="mbtn" data-side="en" data-id="${p.id}">${esc(p.en)}</button>`).join("")+`</div><div class="col">`+b.map(p=>`<button class="mbtn ko" data-side="ko" data-id="${p.id}">${esc(p.ko)}</button>`).join("")+`</div></div>`}
  A.innerHTML=h;
  const mb=$("#mainBtn");mb.textContent="확인";mb.disabled=true;mb.className="big";mb.onclick=onMain;
  if($("#spk"))$("#spk").onclick=()=>speakItem(it);
  if(q.speak&&it)speakItem(it);
  if(q.t==="mc"){
    A.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(L.state!=="answer")return;sfx("tap");const tx=q.opts[+b.dataset.k];if(isLatin(tx))speak(tx);
      A.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");L.sel=+b.dataset.k;mb.disabled=false});
  }else if(q.t==="build"){
    L.built=[];const bank=$("#bank"),line=$("#aline");
    const redraw=()=>{line.innerHTML=L.built.map((k,ix)=>(ix?`<span class="tile slash">/</span>`:"")+`<button class="tile" data-ix="${ix}">${esc(q.tiles[k])}</button>`).join("");
      line.querySelectorAll("button.tile").forEach(b=>b.onclick=()=>{if(L.state!=="answer")return;const k=L.built.splice(+b.dataset.ix,1)[0];bank.querySelector(`[data-k="${k}"]`).classList.remove("used");redraw()});
      mb.disabled=L.built.length===0};
    bank.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(L.state!=="answer"||b.classList.contains("used"))return;b.classList.add("used");sfx("tap");speak(q.tiles[+b.dataset.k]);L.built.push(+b.dataset.k);redraw()});
    L.redraw=redraw;
  }else if(q.t==="type"){
    const tin=$("#tin");setTimeout(()=>{try{tin.focus()}catch(e){}},50);
    tin.oninput=()=>{mb.disabled=!tin.value.trim()};
    tin.onkeydown=e=>{if(e.key==="Enter"&&!mb.disabled){e.preventDefault();mb.click()}};
  }else if(q.t==="match"){
    let se=null,sk=null,left=q.pairs.length,bad=false;
    A.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("ok")||L.state!=="answer")return;
      if(b.dataset.side==="en"){speakItem(BY[b.dataset.id]);A.querySelectorAll('[data-side="en"]').forEach(x=>x.classList.remove("sel"));se=b}
      else{sfx("tap");A.querySelectorAll('[data-side="ko"]').forEach(x=>x.classList.remove("sel"));sk=b}
      b.classList.add("sel");
      if(se&&sk){
        if(se.dataset.id===sk.dataset.id){sfx("pair");[se,sk].forEach(x=>{x.classList.remove("sel");x.classList.add("ok")});left--;
          if(!left){sfx("ok");L.state="next";if(!bad)L.first++;feedback("ok","✅ 잘했어요!","모든 짝을 맞췄어요.");mb.disabled=false;mb.textContent="계속"}}
        else{bad=true;sfx("bad");L.miss++;setProg();const a=se,c=sk;[a,c].forEach(x=>{x.classList.remove("sel");x.classList.add("bad")});setTimeout(()=>[a,c].forEach(x=>x.classList.remove("bad")),400);
          markWeak(a.dataset.id,"뜻");L.mistakes.set(a.dataset.id,"뜻")}
        se=sk=null;
      }
    });
  }
}
function isCorrect(q){
  if(q.t==="mc")return L.sel===q.a;
  if(q.t==="build")return L.built.map(k=>q.tiles[k]).join("|")===q.ans.join("|");
  if(q.t==="type"){const v=norm($("#tin").value);return q.accept.some(a=>norm(a)===v)}
  return true;
}
function lockInputs(){document.querySelectorAll("#qarea .opt,#qarea .tile").forEach(b=>b.disabled=true);const t=$("#tin");if(t)t.disabled=true}
function unlockInputs(q){
  if(q.t==="mc"){document.querySelectorAll("#qarea .opt").forEach(b=>{b.disabled=false;b.classList.remove("sel","wrong")});L.sel=null}
  if(q.t==="build"){document.querySelectorAll("#bank .tile").forEach(b=>{b.disabled=false;b.classList.remove("used")});L.built=[];L.redraw()}
  if(q.t==="type"){const t=$("#tin");t.disabled=false;t.value="";try{t.focus()}catch(e){}}
  $("#mainBtn").disabled=true;
}
function onMain(){
  const q=L.qs[L.i],mb=$("#mainBtn"),it=BY[q.id];
  if(L.state==="answer"){
    if(isCorrect(q)){
      L.state="next";lockInputs();
      if(q.t==="mc")document.querySelectorAll("#qarea .opt")[q.a].classList.add("right");
      if(L.tries===0){L.first++;if(L.mode.review&&S.weak[q.id]){const w=S.weak[q.id];w.n=(w.n||1)-1;if(w.n<=0)delete S.weak[q.id];save()}}
      sfx("ok");speakItem(it);
      feedback("ok","✅ "+["정답이에요!","훌륭해요!","완벽해요!","잘했어요!"][Math.floor(Math.random()*4)],q.expl||"");
      mb.textContent="계속";mb.className="big";
    }else{
      L.tries++;sfx("bad");
      if(q.t==="mc"&&L.sel!=null)document.querySelectorAll("#qarea .opt")[L.sel].classList.add("wrong");
      if(L.tries===1){
        L.miss++;markWeak(q.id,q.kind);if(q.id)L.mistakes.set(q.id,q.kind);setProg();
        L.state="hint";lockInputs();
        feedback("hint","💡 힌트",esc(q.hint));mb.textContent="다시 풀기";mb.className="big gold";
      }else{
        L.state="next";lockInputs();
        if(q.t==="mc")document.querySelectorAll("#qarea .opt")[q.a].classList.add("right");
        const ans=q.t==="mc"?q.opts[q.a]:q.t==="build"?q.ans.join(" / "):q.show;
        speakItem(it);
        feedback("bad","❌ 정답: "+esc(ans),(q.expl||"")+"<br><b>이 문제는 레슨 끝에 한 번 더 나와요.</b>");
        mb.textContent="계속";mb.className="big red";
        const again=Object.assign({},q);if(q.t==="build")again.tiles=shuffle(q.tiles);if(q.t==="mc"){const o=q.opts[q.a];again.opts=shuffle(q.opts);again.a=again.opts.indexOf(o)}
        L.qs.push(again);L.total++;
      }
    }
  }else if(L.state==="hint"){L.state="answer";resetSheet();unlockInputs(q);mb.textContent="확인";mb.className="big"}
  else if(L.state==="next"){L.done++;L.i++;if(L.i>=L.qs.length)finish();else renderQ()}
}
function finish(){
  const l=L.lesson;const gain=10+L.first*2;S.xp+=gain;
  const isMain=MAIN.includes(l.key);const wasDone=S.done[l.key];
  if(isMain)S.done[l.key]=true;
  const t=today();if(S.last!==t){S.streak=(S.last===yesterday()?S.streak:0)+1;S.last=t}
  save();sfx("win");
  const acc=L.done?Math.round(L.first/L.done*100):0;
  const weak=[...L.mistakes.entries()].map(([id,k])=>({it:BY[id],k})).filter(x=>x.it);
  const nextKey=isMain?MAIN[MAIN.indexOf(l.key)+1]:null;const next=nextKey&&CH.lessons.find(x=>x.key===nextKey);
  $("#resultInner").innerHTML=`
    <div style="font-size:60px">🎉</div><h2>${esc(l.name)} 완료!</h2>
    <div class="cards"><div class="rc"><b>획득 XP</b><span>⚡ ${gain}</span></div><div class="rc g"><b>한 번에 정답</b><span>🎯 ${acc}%</span></div><div class="rc b"><b>연속 학습</b><span>🔥 ${S.streak}</span></div></div>
    ${weak.length?`<div class="weaklist"><h4>오늘 틀린 단어 (오답 노트에 저장됨)</h4>${weak.map(w=>`<div><b>${esc(w.it.en)}</b> — ${esc(w.it.ko)} <span class="tag ${tagCls(w.k)}">${esc(w.k)}</span></div>`).join("")}</div>`:`<div class="ts ko" style="color:var(--green-d);font-weight:700">틀린 문제 없이 끝냈어요!</div>`}
    ${next&&!wasDone?`<div class="ko" style="color:var(--mute);font-size:14px">다음 강이 열렸어요: <b>${esc(next.name)}</b></div>`:""}
    ${next?`<button class="big" id="nextBtn">다음 강: ${esc(next.name)}</button>`:""}
    <button class="big ${next?"ghost":""}" id="homeBtn">홈으로</button>
    <button class="big ghost" id="retryBtn">다시 풀기</button>`;
  show("result");
  if(next)$("#nextBtn").onclick=()=>startStudy(next);
  $("#homeBtn").onclick=()=>{renderHome();show("home")};
  $("#retryBtn").onclick=()=>startQuiz(l,L.mode);
}
const tagCls=k=>({"뜻":"m","철자":"s","구조":"s","발음":"p","혼동":"c","약어":"c"}[k]||"m");

/* ===================== NOTES ===================== */
function renderNotes(){
  const ids=Object.keys(S.weak).filter(id=>BY[id]);
  const groups={"뜻을 모르는 단어":[],"철자·구조를 틀린 단어":[],"발음을 틀린 단어":[],"비슷한 단어를 혼동한 경우":[],"약어를 틀린 단어":[]};
  ids.forEach(id=>{const w=S.weak[id],k=(w&&w.k)||{};const it=BY[id];
    if(k["뜻"])groups["뜻을 모르는 단어"].push(it);if(k["철자"]||k["구조"])groups["철자·구조를 틀린 단어"].push(it);
    if(k["발음"])groups["발음을 틀린 단어"].push(it);if(k["혼동"])groups["비슷한 단어를 혼동한 경우"].push(it);if(k["약어"])groups["약어를 틀린 단어"].push(it)});
  $("#notesInner").innerHTML=ids.length?Object.entries(groups).filter(([,v])=>v.length).map(([g,v])=>`<div class="weaklist" style="margin-bottom:12px"><h4>${g} (${v.length})</h4>${v.map(it=>`<div><b>${esc(it.en)}</b> [${esc(it.pr)}] — ${esc(it.ko)}</div>`).join("")}</div>`).join("")+
    `<button class="big" id="revGo">💪 오답 복습 시작</button>`
    :`<p class="ko" style="color:var(--mute)">아직 틀린 단어가 없어요. 문제를 풀다가 틀리면 여기에 종류별로 모여요.</p>`;
  if(ids.length)$("#revGo").onclick=()=>startQuiz({key:"REV",name:"오답 복습"},{review:true});
}

/* ===================== WIRING ===================== */
document.querySelectorAll("[data-quit]").forEach(b=>b.onclick=()=>{
  modal(`<h3>그만둘까요?</h3><p>지금 나가면 이번 레슨 진행은 저장되지 않아요.<br>(틀린 단어는 오답 노트에 남아요)</p><button class="big" id="mStay">계속 공부하기</button><button class="big ghost" id="mLeave">나가기</button>`);
  $("#mStay").onclick=closeModal;$("#mLeave").onclick=()=>{closeModal();try{speechSynthesis.cancel()}catch(e){}renderHome();show("home")};
});
$("#modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.querySelectorAll(".snd").forEach(b=>b.onclick=()=>{SOUND=!SOUND;store.set("sound",SOUND);syncSnd();if(SOUND){ac();sfx("ok");speak("sound on")}else{try{speechSynthesis.cancel()}catch(e){}}});
$("#notesBtn").onclick=()=>{renderNotes();show("notes")};
$("#notesBack").onclick=()=>{renderHome();show("home")};
$("#resetBtn").onclick=()=>{modal(`<h3>기록을 초기화할까요?</h3><p>진도, XP, 오답 노트가 모두 지워져요.</p><button class="big red" id="mReset">초기화</button><button class="big ghost" id="mNo">취소</button>`);
  $("#mReset").onclick=()=>{S={xp:0,streak:0,last:"",done:{},weak:{},open:{}};save();closeModal();renderHome()};$("#mNo").onclick=closeModal};
document.addEventListener("keydown",e=>{
  if($("#lesson").classList.contains("hidden")||!L)return;const q=L.qs[L.i];if(!q)return;
  if(q.t==="mc"&&L.state==="answer"&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll("#qarea .opt")[+e.key-1];if(b)b.click()}
  if(e.key==="Enter"&&document.activeElement.id!=="tin"&&!$("#mainBtn").disabled){e.preventDefault();$("#mainBtn").click()}
});
// 이전 버전 기록 옮기기 (1강)
try{for(const k of Object.keys(S.done)){if(/^[A-Z]\d$/.test(k)){S.done["2"+k]=S.done[k];delete S.done[k]}}
  const old=JSON.parse(localStorage.getItem("medilingo_done")||"{}");if(old.L1)S.done["2P0"]=true;if(old.L2&&old.L3&&old.L4)S.done["2F1"]=true;save()}catch(e){}
renderHome();
try{if("serviceWorker" in navigator&&location.protocol!=="file:")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
</script>
